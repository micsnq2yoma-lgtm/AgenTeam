name: Preserve the verified Windows updater test fixture
on:
  push:
    branches: [codex/qa-agenteam-v0.7.3]
    paths: [.github/workflows/qa-preserve-loopback-073.yml]
permissions:
  actions: read
  contents: read
jobs:
  preserve:
    if: github.repository == 'micsnq2yoma-lgtm/AgenTeam'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify and copy the original archived loopback shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/baseline-060-loopback-shell.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14742165408/zip" > "$archive"
          printf '%s  %s\n' '71d8e1b58493e2331e36ec29ac6068cafa0893441af2742c5f19f1ced5d4ab70' "$archive" | sha256sum -c
          unzip -q "$archive" -d fixture
          find fixture -type f -name '*.exe' -print | grep .
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-060-loopback-shell
          path: fixture/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
