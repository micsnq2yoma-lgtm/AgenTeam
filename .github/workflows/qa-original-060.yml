name: Check original 0.6.0 desktop data before upgrade
on:
  push:
    branches: [codex/qa-upgrade-060-061]
    paths: [.github/workflows/qa-original-060.yml]
permissions:
  contents: read
  actions: read
jobs:
  original:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get original 0.6.0 draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'upgrade-qa'
          "QA_ROOT=$root" >> $env:GITHUB_ENV
          gh run download 44299783178 --repo micsnq2yoma-lgtm/AgenTeam --name 'AgenTeam-Windows-x64-8384e2d06013b68f36ed4ed256beeef9b4fb9566' --dir "$root/original"
      - name: Open original version and verify fixture data through its running UI and session APIs
        shell: pwsh
        run: ./qa/prepare.ps1 -Rehearse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: before-upgrade-original-0.6.0
          path: ${{ runner.temp }}/upgrade-qa/evidence/
          retention-days: 7
