name: AgenTeam Windows release
on:
  push:
    branches: [codex/agenteam-release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenteam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'micsnq2yoma-lgtm/AgenTeam'
    runs-on: windows-2022
    outputs:
      sdk_sha256: ${{ steps.package.outputs.sdk_sha256 }}
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release identity
        id: identity
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid release version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare locked dependencies
        shell: pwsh
        run: |
          . ./scripts/windows-build-environment.ps1
          & ./scripts/download_nodejs.ps1
          Use-BundledNodeBuildTools -ProjectDir $env:GITHUB_WORKSPACE
          npm ci --no-audit --no-fund
      - name: Build NSIS installer
        shell: pwsh
        run: ./build_windows.ps1 -Candidate -SkipPortable
      - name: Check package identity and record installer digest
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $name = "AgenTeam_${env:VERSION}_x64-setup.exe"
          $installer = Get-Item -LiteralPath "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/$name"
          New-Item -ItemType Directory candidate | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination candidate
          $sdkHash = (Get-FileHash -LiteralPath 'src-tauri/resources/claude-agent-sdk/claude.exe').Hash
          "sdk_sha256=$sdkHash" >> $env:GITHUB_OUTPUT
          (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  $name" | Set-Content candidate/SHA256SUMS -Encoding ascii
      - name: Check updater signing and profile import
        run: node --test scripts/agenteam-release.test.mjs
      - name: Install and launch the candidate on the disposable runner
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Item candidate/*-setup.exe
          $target = Join-Path $env:RUNNER_TEMP 'AgenTeam-Smoke'
          $installed = Start-Process -FilePath $package.FullName -ArgumentList '/S',"/D=$target" -PassThru -Wait -WindowStyle Hidden
          if ($installed.ExitCode -ne 0) { throw "NSIS exited with $($installed.ExitCode)" }
          $exe = Get-Item -LiteralPath (Join-Path $target 'AgenTeam.exe')
          $expected = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($package.VersionInfo.ProductName -ne 'AgenTeam' -or $package.VersionInfo.ProductVersion -ne $expected) { throw 'Unexpected installer identity' }
          foreach ($resource in 'server-dist.js','nodejs/node.exe','cli','document-processing','speech-inference') {
            if (!(Test-Path -LiteralPath (Join-Path $target $resource))) { throw "Missing installed resource $resource" }
          }
          $legalFiles = node scripts/verify-license-contract.mjs --list-legal-files
          if ($LASTEXITCODE -ne 0 -or !$legalFiles) { throw 'Cannot enumerate required notices' }
          foreach ($file in $legalFiles) {
            $installedNotice = Join-Path $target "legal/$file"
            if ((Get-FileHash -LiteralPath $installedNotice).Hash -ne (Get-FileHash -LiteralPath $file).Hash) { throw "Installed legal notice differs: $file" }
          }
          $app = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden
          $lock = Join-Path $env:USERPROFILE '.agenteam/app.lock'
          try {
            $ready = $false
            for ($i = 0; $i -lt 60 -and !$app.HasExited; $i++) {
              if ((Test-Path $lock) -and (Get-Content -Raw $lock).Trim() -eq [string]$app.Id) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$ready) { throw 'Installed app did not acquire its own profile lock' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AgenTeam-Windows-x64-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  upgrade:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: AgenTeam-Windows-x64-${{ github.sha }}
          path: candidate
      - name: Upgrade the latest public Windows release to the candidate
        shell: pwsh
        env:
          EXPECTED_SDK_SHA256: ${{ needs.windows.outputs.sdk_sha256 }}
        run: ./qa/verify-windows-candidate-upgrade.ps1

  draft:
    if: github.ref_type == 'tag'
    needs: upgrade
    runs-on: ubuntu-latest
    environment: agenteam-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: AgenTeam-Windows-x64-${{ github.sha }}
          path: candidate
      - name: Install the locked signing CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sign and verify the exact installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          (cd candidate && sha256sum -c SHA256SUMS)
          node node_modules/@tauri-apps/cli/tauri.js signer sign candidate/*-setup.exe
          node scripts/agenteam-release.mjs candidate
      - name: Create draft for installation testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" candidate/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "AgenTeam $GITHUB_REF_NAME" --generate-notes
