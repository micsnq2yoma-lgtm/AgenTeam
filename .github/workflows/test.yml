name: Test

# Regression gate. The whole point of the test suite is to catch regressions
# during fast iteration — so it MUST run automatically on every PR and push,
# not just locally. Required check: a PR that fails this cannot merge.
on:
  pull_request:
  push:
    branches: [main, "dev/**", "feat/kb-*", "fix/anydoc-same-tick-rewrite"]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JS/TS gate: typecheck + lint + deterministic test projects + bundle smoke.
  #
  # `integration` is the CI-safe stateful pool: serial, scratch filesystem and
  # loopback-only network via setup-integration.ts. Real Provider / SDK smoke
  # lives in `credentialed` and is intentionally excluded from public CI.
  js:
    name: typecheck · lint · tests · build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:classification
      - run: npm run test:build-scripts
      - run: npm run test:unit
      # `dom` project (jsdom, no secrets) holds security-invariant tests —
      # externalResourceGuard (zero-egress) + WidgetRenderer (about:srcdoc
      # transport). Must gate too, else those regressions wouldn't block a merge.
      - run: npm run test:dom
      - run: npm run test:integration
      # Typecheck does not exercise esbuild/Vite bundling, raw imports, or
      # runtime entrypoint packaging. These cheap smoke builds catch that class.
      - run: npm run build:server
      - run: npm run build:bridge
      - run: npm run build:cli
      - run: npm run build:web

  # Rust gate: cargo test plus project redline Clippy rules. We only deny
  # disallowed_methods/macros here; ordinary Clippy warnings stay non-fatal
  # until they are cleaned up in a dedicated phase.
  rust:
    name: cargo test · clippy redlines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limit disk use for the two AnyDoc Clippy builds
        if: (github.head_ref || github.ref_name) == 'fix/anydoc-same-tick-rewrite'
        run: printf '%s\n' CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 >> "$GITHUB_ENV"
      - name: Limit disk use for K4 native resource and release tests
        if: (github.head_ref || github.ref_name) == 'feat/kb-k4-index'
        run: printf '%s\n' CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 >> "$GITHUB_ENV"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            build-essential \
            file
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare Tauri bundle path placeholders for cargo tests
        run: |
          # Tauri validates bundle resource paths during build-script execution.
          # This Linux CI job runs Rust unit tests, not a distributable Linux
          # bundle, so provide inert runner-local placeholders for paths that
          # are intentionally not committed.
          mkdir -p src-tauri/resources/claude-agent-sdk
          mkdir -p src-tauri/resources/sharp-runtime
          mkdir -p src-tauri/resources/tsx-runtime
          mkdir -p src-tauri/resources/nodejs
          mkdir -p src-tauri/resources/integrated-runtimes/dsh
          mkdir -p src-tauri/resources/speech-inference
          mkdir -p src-tauri/resources/playwright-control/@playwright/mcp
          mkdir -p src-tauri/resources/playwright-control/playwright
          mkdir -p src-tauri/resources/playwright-control/playwright-core
          printf 'console.log("ci server-dist placeholder");\n' > src-tauri/resources/server-dist.js
          printf 'console.log("ci plugin-bridge placeholder");\n' > src-tauri/resources/plugin-bridge-dist.mjs
          printf 'ci placeholder\n' > src-tauri/resources/claude-agent-sdk/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/sharp-runtime/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/tsx-runtime/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/nodejs/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/integrated-runtimes/dsh/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/@playwright/mcp/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/playwright/.ci-placeholder
          printf 'ci placeholder\n' > src-tauri/resources/playwright-control/playwright-core/.ci-placeholder
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - if: startsWith(github.head_ref || github.ref_name, 'feat/kb-')
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib knowledge
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D clippy::disallowed_methods -D clippy::disallowed_macros
      - name: Compare knowledge branch Clippy diagnostics with its main baseline
        if: startsWith(github.head_ref || github.ref_name, 'feat/kb-')
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main "$CANDIDATE_SHA")
          evidence="$RUNNER_TEMP/kb-clippy"
          mkdir -p "$evidence"
          compiler=$(rustc --version)
          clippy=$(cargo clippy --version)
          for revision in "$base" "$CANDIDATE_SHA"; do
            git switch --detach "$revision"
            pinned=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
            actual=$(rustc --version)
            [[ "$actual" == "rustc $pinned "* && "$actual" == "$compiler" && "$(cargo clippy --version)" == "$clippy" ]]
            echo "$revision $actual $(cargo clippy --version)"
            cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --message-format=json > "$evidence/$revision.jsonl"
          done
          python3 scripts/compare-clippy-warnings.test.py
          python3 scripts/compare-clippy-warnings.py "$evidence/$base.jsonl" "$evidence/$CANDIDATE_SHA.jsonl"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && startsWith(github.head_ref || github.ref_name, 'feat/kb-') }}
        with:
          name: knowledge-clippy-diagnostics
          path: ${{ runner.temp }}/kb-clippy/*.jsonl

      - uses: actions/setup-node@v4
        if: (github.head_ref || github.ref_name) == 'feat/kb-k4-index'
        with:
          node-version: '24'
      - name: Verify K4 retrieval after five real document conversions
        if: (github.head_ref || github.ref_name) == 'feat/kb-k4-index'
        timeout-minutes: 40
        env:
          CARGO_BUILD_JOBS: '2'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euo pipefail
          node scripts/prepare-native-inference.mjs x86_64-unknown-linux-gnu --check-prerequisites
          node scripts/prepare-native-inference.mjs x86_64-unknown-linux-gnu
          export MYAGENTS_KB_TEST_RESOURCE_ROOT="$PWD/src-tauri/resources"
          test_name=search::knowledge_indexer::tests::resource_backed_ingestion_indexes_five_formats_end_to_end
          log="$RUNNER_TEMP/k4-resource-test.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib "$test_name" \
            -- --exact --ignored --nocapture | tee "$log"
          grep -Fx "test $test_name ... ok" "$log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
      - name: Measure K4 release search latency over 10,000 chunks
        if: (github.head_ref || github.ref_name) == 'feat/kb-k4-index'
        timeout-minutes: 30
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          test_name=search::knowledge_indexer::tests::knowledge_bm25_10k_chunks_keeps_p95_below_100ms
          log="$RUNNER_TEMP/k4-benchmark.log"
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib "$test_name" \
            -- --exact --ignored --nocapture | tee "$log"
          grep -F '10000 chunks, 120 samples, p95=' "$log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"

      - name: Compare complete Clippy diagnostics for the AnyDoc fix
        if: "!cancelled() && (github.head_ref || github.ref_name) == 'fix/anydoc-same-tick-rewrite'"
        env:
          BASELINE_SHA: d2ebb8e3d1f4b73242b8d0e51f5250dde66d444a
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/anydoc-clippy"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA" "$CANDIDATE_SHA"
          trap 'git switch --detach "$GITHUB_SHA"' EXIT
          rustc +1.92.0 -Vv
          cargo +1.92.0 clippy --version
          # Reuse dependencies at one absolute path. Recheck the application
          # itself even if Cargo restored artifacts from an earlier run.
          for revision in "$BASELINE_SHA" "$CANDIDATE_SHA"; do
            git switch --detach "$revision"
            test "$(git rev-parse HEAD)" = "$revision"
            cargo +1.92.0 clean --manifest-path src-tauri/Cargo.toml -p myagents
            cargo +1.92.0 clippy --manifest-path src-tauri/Cargo.toml --locked \
              --all-targets --message-format=json \
              > "$evidence/$revision.jsonl"
          done
          python3 - "$evidence/$BASELINE_SHA.jsonl" "$evidence/$CANDIDATE_SHA.jsonl" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()

          def warnings(filename):
              found = set()
              finished = False
              application = False
              with open(filename, encoding="utf-8") as lines:
                  for line in lines:
                      event = json.loads(line)
                      if event["reason"] == "build-finished":
                          finished = event["success"]
                      if event["reason"] == "compiler-artifact" and event["target"]["name"] == "app_lib":
                          application = True
                      if event["reason"] != "compiler-message":
                          continue
                      diagnostic = event["message"]
                      if diagnostic["level"] == "error":
                          raise ValueError(f"{filename}: {diagnostic['message']}")
                      if diagnostic["level"] != "warning":
                          continue
                      lint = (diagnostic["code"] or {}).get("code", "")
                      manifest = Path(event["manifest_path"])
                      names = [s["file_name"] for s in diagnostic["spans"] if s["is_primary"]]
                      for name in names or [manifest]:
                          path = manifest.parent / name
                          if not path.exists() and (root / name).exists():
                              path = root / name
                          found.add((lint, os.path.relpath(path.resolve(), root), diagnostic["message"]))
              if not (finished and application):
                  raise ValueError(f"{filename}: expected a successful complete application build")
              return found

          baseline, candidate = map(warnings, sys.argv[1:])
          added = candidate - baseline
          print(f"Baseline {Path(sys.argv[1]).stem}: {len(baseline)} warnings")
          print(f"Candidate {Path(sys.argv[2]).stem}: {len(candidate)} warnings; {len(added)} new")
          for warning in sorted(added):
              print(json.dumps(warning, ensure_ascii=False))
          sys.exit(bool(added))
          PY
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && (github.head_ref || github.ref_name) == 'fix/anydoc-same-tick-rewrite'"
        with:
          name: anydoc-clippy-diagnostics
          path: ${{ runner.temp }}/anydoc-clippy/*.jsonl
          if-no-files-found: error
          retention-days: 7

  # `--all-targets` above covers Rust target kinds for Linux; it does not
  # type-check or execute `cfg(windows)`. Run workspace IO tests natively:
  # compile-only checks cannot detect invalid OS rename parameters (#641).
  windows-rust:
    name: Windows cargo check · workspace and knowledge IO
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify bundled Node replacement with native NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $env:MYAGENTS_TEST_MAKENSIS = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          node --test scripts/windows-node-runtime-install.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare signed CLIProxy build inputs
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-cliproxy.mjs win32-x64
      - name: Verify Windows bootstrap download retry and publication
        run: node --test scripts/node-runtime.test.mjs
      - name: Verify selective Sherpa source extraction on Windows
        run: node --test scripts/sherpa-source-extraction.test.mjs
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare Tauri resources for Windows Rust validation
        shell: pwsh
        run: |
          $resourceDirs = @(
            'src-tauri/resources/claude-agent-sdk',
            'src-tauri/resources/sharp-runtime',
            'src-tauri/resources/tsx-runtime',
            'src-tauri/resources/nodejs',
            'src-tauri/resources/integrated-runtimes/dsh',
            'src-tauri/resources/speech-inference',
            'src-tauri/resources/cli',
            'src-tauri/resources/playwright-control/@playwright/mcp',
            'src-tauri/resources/playwright-control/playwright',
            'src-tauri/resources/playwright-control/playwright-core'
          )
          foreach ($directory in $resourceDirs) {
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }
          Set-Content src-tauri/resources/server-dist.js 'console.log("ci server-dist placeholder");'
          Set-Content src-tauri/resources/plugin-bridge-dist.mjs 'console.log("ci plugin-bridge placeholder");'
          Set-Content src-tauri/resources/claude-agent-sdk/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/sharp-runtime/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/tsx-runtime/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/nodejs/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/integrated-runtimes/dsh/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/cli/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/@playwright/mcp/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/playwright/.ci-placeholder 'ci placeholder'
          Set-Content src-tauri/resources/playwright-control/playwright-core/.ci-placeholder 'ci placeholder'
          # Tauri copies these beside the native binary: execution needs real
          # VC runtimes, matching the existing Windows build preparation.
          Copy-Item (Join-Path $env:WINDIR 'System32\vcruntime140.dll') src-tauri/resources/vcruntime140.dll
          Copy-Item (Join-Path $env:WINDIR 'System32\vcruntime140_1.dll') src-tauri/resources/vcruntime140_1.dll
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Run native workspace and knowledge tests with Tauri's application manifest
        shell: pwsh
        run: |
          $messages = & cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExecutable = $messages | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'app_lib' -and $_.executable } |
            Select-Object -ExpandProperty executable
          if (@($testExecutable).Count -ne 1) { throw 'Expected one application library test executable' }
          # Tauri's resource compiler links the common-controls v6 manifest to
          # app binaries only; the library test imports the same dialog APIs.
          $metadata = & cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version=1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tauriBuild = $metadata.packages | Where-Object { $_.name -eq 'tauri-build' }
          if (@($tauriBuild).Count -ne 1) { throw 'Expected one resolved tauri-build package' }
          $manifest = Join-Path (Split-Path $tauriBuild.manifest_path) 'src/windows-app-manifest.xml'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) { throw 'Windows SDK manifest tool not found' }
          & $mt -nologo -manifest $manifest "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable 'workspace_files::'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable 'knowledge::'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable 'document_processing::' --format pretty --color never | Tee-Object -Variable documentResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $requiredCases = @(
            'document_processing::tests::source_copy_refuses_an_existing_writer_and_blocks_writes_until_finished'
            'document_processing::tests::live_preemption_requeues_same_job_with_first_snapshot_and_without_partial_staging'
          )
          foreach ($required in $requiredCases) {
            if ($documentResults -notcontains "test $required ... ok") { throw "Missing passing Windows test: $required" }
          }
          if (-not ($documentResults -match '^test result: ok\. [1-9][0-9]* passed; 0 failed;')) {
            throw 'Expected a nonempty passing document_processing:: suite'
          }
      - name: Inspect native test loader imports on failure
        if: failure()
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          Get-ChildItem src-tauri/target/debug/deps/app_lib-*.exe | ForEach-Object { & $dumpbin /imports $_.FullName }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-workspace-test-loader
          path: src-tauri/target/debug/deps/app_lib-*.exe
          retention-days: 1

  # CLIProxy native lifecycle fixtures require a supported Unix platform.
  # Keep Linux's broad Rust gate; apple-metal requires the Xcode 26 SDK.
  macos-cliproxy:
    name: macOS CLIProxy lifecycle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare signed CLIProxy build inputs
        run: |
          npm ci --ignore-scripts
          node scripts/prepare-cliproxy.mjs
      - name: Prepare non-executed Tauri resource paths
        run: |
          mkdir -p src-tauri/resources/{claude-agent-sdk,sharp-runtime,tsx-runtime,nodejs,speech-inference,cli,document-processing,integrated-runtimes/dsh}
          mkdir -p src-tauri/resources/playwright-control/{@playwright/mcp,playwright,playwright-core}
          for directory in claude-agent-sdk sharp-runtime tsx-runtime nodejs speech-inference cli document-processing integrated-runtimes/dsh playwright-control/@playwright/mcp playwright-control/playwright playwright-control/playwright-core; do
            touch "src-tauri/resources/$directory/.ci-placeholder"
          done
          touch src-tauri/resources/server-dist.js src-tauri/resources/plugin-bridge-dist.mjs
      - name: Test native file-drop pasteboard compatibility
        run: cargo test --manifest-path vendor/tao/Cargo.toml --locked --lib file_drop_tests --target-dir src-tauri/target
      - name: Test native component lifecycle without provider credentials
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 'cliproxy::' --config "target.$host.runner = ['env', 'DYLD_FALLBACK_LIBRARY_PATH=/usr/lib/swift']"
